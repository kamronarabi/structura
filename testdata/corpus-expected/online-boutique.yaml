repo: online-boutique
source: |
  GoogleCloudPlatform/microservices-demo. Edges taken from the project's own
  architecture diagram in docs/ and its README service table, which lists each
  service and what it calls.

edges:
  # The frontend is the entry point and fans out to almost everything.
  - {from: frontend, to: productcatalogservice}
  - {from: frontend, to: cartservice}
  - {from: frontend, to: recommendationservice}
  - {from: frontend, to: currencyservice}
  - {from: frontend, to: shippingservice}
  - {from: frontend, to: checkoutservice}
  - {from: frontend, to: adservice}
  - {from: frontend, to: shoppingassistantservice}

  # Checkout orchestrates the purchase.
  - {from: checkoutservice, to: productcatalogservice}
  - {from: checkoutservice, to: cartservice}
  - {from: checkoutservice, to: currencyservice}
  - {from: checkoutservice, to: paymentservice}
  - {from: checkoutservice, to: shippingservice}
  - {from: checkoutservice, to: emailservice}

  - {from: recommendationservice, to: productcatalogservice}
  - {from: cartservice, to: redis-cart}
  - {from: loadgenerator, to: frontend}

allowed:
  # Ingress routing, correct but a deployment detail rather than app design.
  - {from: frontend-ingress, to: frontend}
  # The Terraform under terraform/ provisions the cluster this runs on.
  - {from: my_cluster, to: enable_google_apis}
  - {from: prs-gke-cluster, to: enable_google_apis}
  # frontend reads PACKAGING_SERVICE_URL (src/frontend/packaging_info.go), but
  # kubernetes-manifests/frontend.yaml leaves it commented out: it is an
  # optional integration with a service the operator supplies, not part of
  # this deployment. Listed so the oracle's finding is accounted for rather
  # than silently dropped.
  - {from: frontend, to: packagingservice}

  # Google Cloud. Four services declare a GCP SDK as a direct dependency --
  # productcatalogservice reaches AlloyDB and Secret Manager, and all four run
  # Cloud Profiler -- so these edges are true and the resolver is right to draw
  # them. They are here rather than under `edges` because this file's source is
  # the project's own architecture diagram, which draws the services and not
  # the platform underneath them. Listing the four by name rather than matching
  # `* -> gcp` keeps the gate informative: a fifth service acquiring a cloud
  # dependency is a change to the architecture, and it should surface here and
  # be read by someone rather than be absorbed by a wildcard.
  #
  # The Python and Node services joined the list when the dependency table
  # learned their ecosystems' spelling for the same SDK family: currencyservice
  # and paymentservice declare @google-cloud/profiler, emailservice declares
  # google-cloud-trace, and shoppingassistantservice reaches AlloyDB and Secret
  # Manager. Before that, whether a service drew this edge depended on the
  # language it happened to be written in rather than on what it talks to.
  #
  # They arrived here by failing the gate, which is the argument against
  # writing this as `* -> gcp`.
  - {from: checkoutservice, to: gcp}
  - {from: currencyservice, to: gcp}
  - {from: emailservice, to: gcp}
  - {from: frontend, to: gcp}
  - {from: paymentservice, to: gcp}
  - {from: productcatalogservice, to: gcp}
  - {from: shippingservice, to: gcp}
  - {from: shoppingassistantservice, to: gcp}

  # Tracing. Every instrumented service reads COLLECTOR_SERVICE_ADDR, which is
  # what the source oracle found, and these sat under `edges` for a while on
  # the strength of that -- taking recall to 0.71 and blaming unrendered Helm.
  # Rendering the chart does not produce them: helm-chart/values.yaml sets
  # opentelemetryCollector.create to false, kubernetes-manifests/frontend.yaml
  # has the variables commented out, and the collector node exists at all only
  # because the scan reads kustomize/components/google-cloud-operations/,
  # an opt-in component no base includes.
  #
  # So the application can talk to a collector and no deployment described
  # here wires one up. That is a capability, not a dependency, and charging
  # recall for it would have measured the resolver against a configuration the
  # repository does not ship.
  - {from: frontend, to: opentelemetrycollector}
  - {from: checkoutservice, to: opentelemetrycollector}
  - {from: currencyservice, to: opentelemetrycollector}
  - {from: emailservice, to: opentelemetrycollector}
  - {from: paymentservice, to: opentelemetrycollector}
  - {from: productcatalogservice, to: opentelemetrycollector}
  - {from: recommendationservice, to: opentelemetrycollector}

# The oracle derives these same relationships from the application source, so
# that this file is checked rather than trusted. See oracle_test.go.
oracle:
  sourceGlob: src/*
  aliases:
    # The collector is deployed as opentelemetrycollector; the variable the
    # services read is COLLECTOR_SERVICE_ADDR.
    # helm-chart/templates/frontend.yaml sets it to
    # "{{ .Values.opentelemetryCollector.name }}:4317", and
    # helm-chart/values.yaml names it opentelemetrycollector.
    COLLECTOR_SERVICE: opentelemetrycollector
    # cartservice reads REDIS_ADDR; the Deployment it runs under supplies
    # redis-cart:6379 (kubernetes-manifests/cartservice.yaml).
    REDIS: redis-cart
  ignore:
    # A service's own listen address, not a dependency.
    - LISTEN
    # The frontend's own public URL, used to build links back to itself.
    - BASE
