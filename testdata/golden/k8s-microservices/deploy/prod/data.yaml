apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: orders-db
  namespace: prod
spec:
  serviceName: orders-db
  replicas: 1
  selector:
    matchLabels:
      app: orders-db
  template:
    metadata:
      labels:
        app: orders-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-cache
  namespace: prod
spec:
  selector:
    matchLabels:
      app: session-cache
  template:
    metadata:
      labels:
        app: session-cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
---
apiVersion: v1
kind: Service
metadata:
  name: session-cache
  namespace: prod
spec:
  selector:
    app: session-cache
  ports:
    - port: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: legacy-warehouse
  namespace: prod
spec:
  type: ExternalName
  externalName: warehouse.legacy.internal
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shared-endpoints
  namespace: prod
data:
  SEARCH_HOST: search-service
  ANALYTICS_URL: https://analytics.example.com/ingest
  FEATURE_FLAGS: "checkout_v2,fast_ship"
