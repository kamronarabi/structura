apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: prod
  labels:
    app.kubernetes.io/name: api-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      serviceAccountName: api-gateway
      containers:
        - name: api
          image: ghcr.io/acme/api-gateway:1.2.0
          ports:
            - containerPort: 8080
          env:
            - name: CHECKOUT_SVC_URL
              value: http://checkout.prod.svc.cluster.local:8080
            - name: USER_SVC_URL
              value: http://user-service:8080
            - name: REDIS_URL
              value: redis://session-cache:6379/0
            - name: LOG_LEVEL
              value: info
            - name: JWT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: jwt
          envFrom:
            - configMapRef:
                name: shared-endpoints
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: prod
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
