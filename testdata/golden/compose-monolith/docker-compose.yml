name: shopfront

services:
  web:
    build:
      context: ./web
    image: ghcr.io/acme/shopfront-web:${TAG:-1.4.2}
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://shopfront:hunter2@db:5432/shopfront
      REDIS_URL: redis://cache:6379/0
      SEARCH_HOST: search
      STRIPE_API_URL: https://api.stripe.com
      STRIPE_SECRET_KEY: sk_live_EXAMPLENOTAREALKEY
      LOG_LEVEL: info
      APP_ENV: production
    depends_on:
      - db
      - cache
    restart: unless-stopped

  worker:
    image: ghcr.io/acme/shopfront-web:${TAG:-1.4.2}
    command: ["python", "-m", "worker"]
    environment:
      DATABASE_URL: postgres://shopfront:hunter2@db:5432/shopfront
      BROKER_URL: amqp://guest:guest@queue:5672//
    depends_on:
      - db
      - queue
    deploy:
      replicas: 3

  db:
    image: postgres:16-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: hunter2
      POSTGRES_DB: shopfront

  cache:
    image: redis:7-alpine
    expose:
      - "6379"

  queue:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  search:
    image: elasticsearch:8.13.0
    environment:
      discovery.type: single-node

volumes:
  pgdata: {}
