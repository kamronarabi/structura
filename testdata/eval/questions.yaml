# Eval questions for the MCP tool surface.
#
# These do not test the graph — the golden tests do that. They test whether a
# model, given only these tools, arrives at the right answer and does it in a
# reasonable number of calls. A graph can be structurally perfect and still
# useless if the tool surface makes the model take six calls to learn what one
# should have told it.
#
# must_mention is scored case-insensitively, and each entry may list
# alternatives separated by "|" where more than one wording is correct.
# must_not_mention catches the failure that matters most: confident invention.
#
# must_not_mention is an INVENTION check only: names a model could plausibly
# hallucinate that are absent from the graph. It must never list a real
# component, technology, or image. A correct answer to "which service uses
# Redis" names the others while ruling them out, and a substring check reads
# that exclusion as an assertion — so forbidding a real name scores honesty as
# failure. The harness refuses to run a question that does this.
#
# Attribution ("X is the only one", "no") belongs in must_mention, where it can
# be checked without false positives.
#
# max_tool_calls is a design budget, not a correctness threshold. Exceeding it
# is a finding about the tool surface, reported separately from the score.
#
# The budgets were 3-4 and are now 5-6, raised after the first measured run
# rather than guessed. The natural path for any real question is
# overview -> list_nodes -> describe_node -> diagnostics, which is four calls
# before the model has done anything unusual. The server's own instructions
# tell it to check diagnostics before concluding a component has no
# dependencies, so that fourth call is the tool surface working, not failing.
# A budget that every well-behaved run exceeds measures nothing.
#
# Run with: make eval   (requires ANTHROPIC_API_KEY; not part of CI)

questions:
  - id: compose-web-dependencies
    fixture: compose-monolith
    question: What does the web service depend on?
    must_mention: ["redis|cache", "postgres|db", "elasticsearch|search", "stripe"]
    must_not_mention: ["mongodb", "kafka", "cassandra"]
    max_tool_calls: 5

  - id: compose-blast-radius
    fixture: compose-monolith
    question: If the Postgres database went down, which services would be affected?
    must_mention: ["web", "worker"]
    must_not_mention: ["mongodb", "kafka"]
    max_tool_calls: 5

  - id: compose-third-party
    fixture: compose-monolith
    question: Does anything in this repository talk to a third-party payment provider?
    must_mention: ["stripe", "web"]
    must_not_mention: ["paypal", "braintree", "adyen"]
    max_tool_calls: 5

  - id: compose-queue-technology
    fixture: compose-monolith
    question: What message queue technology does this system use, and which service publishes to it?
    must_mention: ["rabbitmq", "worker"]
    must_not_mention: ["kafka", "sqs"]
    max_tool_calls: 5

  - id: k8s-checkout-dependencies
    fixture: k8s-microservices
    question: What does the checkout service depend on?
    must_mention: ["orders-db|postgres", "stripe"]
    must_not_mention: ["mongodb", "mysql", "kafka"]
    max_tool_calls: 5

  - id: k8s-ingress-path
    fixture: k8s-microservices
    question: How does traffic from the internet reach the checkout service?
    must_mention: ["ingress|public", "checkout"]
    must_not_mention: ["nginx-proxy", "traefik"]
    max_tool_calls: 6

  - id: k8s-unresolved
    fixture: k8s-microservices
    question: Are there any dependencies this scan could not resolve? Name them.
    must_mention: ["user-service", "search-service", "broker"]
    must_not_mention: ["mongodb", "kafka"]
    max_tool_calls: 5

  - id: k8s-who-uses-redis
    fixture: k8s-microservices
    question: Which component uses Redis?
    must_mention: ["api-gateway", "session-cache", "only"]
    must_not_mention: ["memcached", "hazelcast"]
    max_tool_calls: 5

  - id: k8s-confidence
    fixture: k8s-microservices
    question: >-
      How confident is the relationship between api-gateway and
      analytics.example.com, and what is the evidence for it?
    must_mention: ["0.7", "env|environment"]
    must_not_mention: ["1.00"]
    max_tool_calls: 5

  - id: k8s-transitive
    fixture: k8s-microservices
    question: Can api-gateway reach orders-db, and if so how?
    must_mention: ["checkout", "yes|can|through|via"]
    must_not_mention: ["mongodb"]
    max_tool_calls: 6

  - id: polyglot-gateway
    fixture: polyglot-monorepo
    question: What does the gateway service call?
    must_mention: ["checkout", "cache|redis"]
    must_not_mention: ["mongodb", "elasticsearch"]
    max_tool_calls: 5

  - id: polyglot-publisher
    fixture: polyglot-monorepo
    question: Which service publishes to the message broker?
    must_mention: ["checkout", "only"]
    must_not_mention: ["nats", "sqs"]
    max_tool_calls: 5

  - id: terraform-api-writes
    fixture: terraform-serverless
    question: Which AWS data stores does the api service write to?
    must_mention: ["orders-primary", "sessions", "uploads"]
    must_not_mention: ["redshift", "aurora"]
    max_tool_calls: 5

  - id: terraform-incomplete
    fixture: terraform-serverless
    question: >-
      Is the picture of this infrastructure complete, or is something missing
      from it?
    must_mention: ["count|for_each|for each", "module|network|vpc"]
    must_not_mention: ["redshift"]
    max_tool_calls: 6

  - id: terraform-worker-storage
    fixture: terraform-serverless
    question: Does the worker write to any database?
    must_mention: ["no|does not|doesn't", "queue|jobs"]
    must_not_mention: ["redshift", "aurora"]
    max_tool_calls: 5

  # The three below were added after a live session found bugs the first
  # fifteen could not see. Each fixture was scanned in isolation, so a name
  # reused across projects never arose, and no question asked for more than
  # one route -- which is exactly where the tool surface was making confident
  # false statements.

  - id: k8s-all-routes
    fixture: k8s-microservices
    question: >-
      List every route by which traffic from the public ingress can reach
      orders-db. I need all of them, not the shortest.
    must_mention: ["api-gateway", "checkout"]
    must_not_mention: ["mongodb"]
    max_tool_calls: 5

  - id: k8s-qualified-name
    fixture: multi-environment
    question: Describe the db component in the prod environment.
    must_mention: ["prod"]
    must_not_mention: ["mongodb"]
    max_tool_calls: 4

  - id: polyglot-local-datastore
    fixture: polyglot-monorepo
    question: >-
      Which datastore does the checkout service write to, and is it defined in
      the same file as checkout or somewhere else?
    must_mention: ["orders-db", "compose|docker-compose|same"]
    must_not_mention: ["mongodb"]
    max_tool_calls: 4
