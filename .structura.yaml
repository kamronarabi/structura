# Structura's own repository is not one system.
#
# testdata/golden holds ten independent sample repositories, each scanned in
# isolation by the golden tests. Scanned together -- which is what happens when
# Structura is pointed at its own checkout -- they share a namespace called
# "prod" and directories called "web" and "worker", and without a boundary the
# scan merges components that belong to different stacks.
#
# Nothing in the file tree distinguishes sibling projects from sibling parts of
# one project, so this is written down rather than inferred. See
# internal/project.
projects:
  - testdata/golden/compose-monolith
  - testdata/golden/containerized-app
  - testdata/golden/helm-chart
  - testdata/golden/helm-umbrella
  - testdata/golden/k8s-microservices
  - testdata/golden/managed-backends
  - testdata/golden/multi-environment
  - testdata/golden/polyglot-monorepo
  - testdata/golden/react-supabase
  - testdata/golden/terraform-serverless

# Corrections. Everything else in this file's sibling graph is inference over
# configuration files, and inference is wrong sometimes; these are the facts
# that override it. A rule here is the answer, not a hint.
#
# relationships:
#   # A dependency that exists only in application code, which a configuration
#   # scan cannot see. It lands with confidence 1.00 and the note as evidence.
#   - from: checkout          # a name, "name.namespace", or a full node id
#     to: orders-db
#     kind: persists_to       # calls, persists_to, publishes_to, subscribes_to,
#                             # depends_on, exposes, contains
#     note: pool built in checkout/internal/store.go
#
#   # An edge inference got wrong.
#   - from: web
#     to: api.stripe.com
#     remove: true
#
# components:
#   # Two boxes that are one component. The first survives.
#   - same: [api.prod, acme/api]
#     note: one service; the basename join will not cross packages/a
#
# A rule that matches nothing is reported as a gap rather than ignored, so a
# correction cannot quietly go stale.
